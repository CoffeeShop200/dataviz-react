name: Deploy
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ ambizionedigitale.isula.corsica }}
          username: ${{ temp-soldats-morts }}
          password: ${{ -&U(#h66?j9q9eI[ }}
          local-dir: ./dist/
          server-dir: /
